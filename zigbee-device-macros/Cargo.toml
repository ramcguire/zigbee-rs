[package]
name = "zigbee-device-macros"
version = "0.1.0"
description = "Proc-macro derive for ZigBee device composition (#[derive(ZigbeeDevice)])"
authors.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["derive", "parsing"] }
proc-macro-crate = "3"
